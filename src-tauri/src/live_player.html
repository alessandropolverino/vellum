<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vellum — Live session</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #0c0a09; color: #f5f5f4;
             display: flex; min-height: 100vh; align-items: center; justify-content: center; text-align: center; }
      .card { padding: 24px; max-width: 360px; }
      h1 { font-size: 1.4rem; color: #fbbf24; margin: 0 0 8px; }
      #status { color: #a8a29e; }
      #log { margin-top: 16px; font-size: .85rem; color: #d6d3d1; word-break: break-word; }
      .ok { color: #34d399 !important; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Vellum</h1>
      <div id="status">Connecting…</div>
      <div id="log"></div>
    </div>
    <script>
      var TOKEN = "__TOKEN__";
      var statusEl = document.getElementById("status");
      var logEl = document.getElementById("log");
      var delay = 1000;
      function connect() {
        var proto = location.protocol === "https:" ? "wss:" : "ws:";
        var ws = new WebSocket(proto + "//" + location.host + "/ws?token=" + encodeURIComponent(TOKEN));
        ws.onopen = function () { delay = 1000; statusEl.textContent = "Connected"; statusEl.className = "ok"; };
        ws.onmessage = function (e) {
          try { var m = JSON.parse(e.data); if (m.type === "hello") return; } catch (_) {}
          logEl.textContent = e.data;
        };
        ws.onclose = function () {
          statusEl.textContent = "Reconnecting…"; statusEl.className = "";
          setTimeout(connect, delay);
          delay = Math.min(delay * 2, 10000);
        };
      }
      connect();
    </script>
  </body>
</html>
