<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vellum — Live session</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #0c0a09; color: #f5f5f4; }
      #app { max-width: 560px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 1.3rem; color: #fbbf24; margin: 0 0 4px; }
      h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: #fbbf24; margin: 18px 0 6px; }
      .muted { color: #a8a29e; font-size: .85rem; }
      .banner { position: sticky; top: 0; z-index: 5; background: #7c2d12; color: #fed7aa; text-align: center;
                padding: 6px; font-size: .8rem; }
      .pick { display: block; width: 100%; text-align: left; margin: 8px 0; padding: 12px; border-radius: 10px;
              border: 1px solid #44403c; background: #1c1917; color: #f5f5f4; font-size: 1rem; }
      .pick small { display: block; color: #a8a29e; }
      .pick:disabled { opacity: .4; }
      .grid { display: grid; gap: 8px; }
      .g3 { grid-template-columns: repeat(3, 1fr); }
      .g6 { grid-template-columns: repeat(3, 1fr); }
      .box { background: #1c1917; border: 1px solid #44403c; border-radius: 10px; padding: 8px; text-align: center; }
      .box b { display: block; font-size: 1.3rem; }
      .box span { font-size: .7rem; color: #a8a29e; text-transform: uppercase; }
      .hp b { color: #34d399; }
      .chip { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 999px;
              background: #7f1d1d; color: #fecaca; font-size: .75rem; }
      .entry { margin: 6px 0; font-size: .9rem; }
      .entry b { color: #fde68a; }
      .pre { white-space: pre-wrap; font-size: .9rem; }
      .err { color: #fca5a5; }
    </style>
  </head>
  <body>
    <div id="banner" class="banner" hidden></div>
    <div id="app"></div>
    <script>
      var SESSION = "__TOKEN__";
      var IT = (navigator.language || "").toLowerCase().indexOf("it") === 0;
      function t(en, it) { return IT ? it : en; }
      var KEY = "vellum.player." + SESSION;
      var app = document.getElementById("app");
      var banner = document.getElementById("banner");

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text !== undefined && text !== null) n.textContent = String(text);
        return n;
      }
      function clear() { while (app.firstChild) app.removeChild(app.firstChild); }
      function store(v) { try { if (v) localStorage.setItem(KEY, v); else localStorage.removeItem(KEY); } catch (_) {} }
      function stored() { try { return localStorage.getItem(KEY); } catch (_) { return null; } }
      function setBanner(msg) { banner.hidden = !msg; banner.textContent = msg || ""; }

      /* ---------- character picker ---------- */
      function showPicker(message) {
        clear();
        app.appendChild(el("h1", null, t("Who are you playing?", "Chi interpreti?")));
        if (message) app.appendChild(el("p", "muted", message));
        var list = el("div");
        app.appendChild(list);
        fetch("/api/roster?s=" + encodeURIComponent(SESSION))
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
          .then(function (items) {
            if (!items.length) {
              list.appendChild(el("p", "muted", t("Waiting for the DM to add characters…", "In attesa che il master aggiunga i personaggi…")));
              setTimeout(function () { showPicker(message); }, 3000);
              return;
            }
            items.forEach(function (it) {
              var b = el("button", "pick");
              b.appendChild(document.createTextNode(it.name));
              if (it.subtitle) b.appendChild(el("small", null, it.subtitle));
              if (it.claimed) { b.disabled = true; b.appendChild(el("small", null, t("Already taken", "Già scelto"))); }
              b.onclick = function () { claim(it.id); };
              list.appendChild(b);
            });
          })
          .catch(function () { list.appendChild(el("p", "err", t("Session not available.", "Sessione non disponibile."))); });
      }

      function claim(id) {
        fetch("/api/claim", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ s: SESSION, characterId: id })
        }).then(function (r) {
          if (r.status === 409) { showPicker(t("Someone else just picked that character.", "Qualcuno ha appena scelto quel personaggio.")); return null; }
          if (!r.ok) throw new Error(r.status);
          return r.json();
        }).then(function (j) { if (j) { store(j.playerToken); connect(j.playerToken); } })
          .catch(function () { showPicker(t("Could not pick the character, try again.", "Impossibile scegliere il personaggio, riprova.")); });
      }

      /* ---------- sheet ---------- */
      function addEntries(parent, entries) {
        (entries || []).forEach(function (e) {
          var d = el("div", "entry");
          var head = e.name || "";
          if (typeof e.attackBonus === "number") head += " (" + (e.attackBonus >= 0 ? "+" : "") + e.attackBonus + ")";
          if (e.damageFormula) head += " " + e.damageFormula;
          d.appendChild(el("b", null, head));
          if (e.description) d.appendChild(document.createTextNode(" — " + e.description));
          parent.appendChild(d);
        });
      }
      function section(title, text) {
        if (!text) return;
        app.appendChild(el("h2", null, title));
        app.appendChild(el("div", "pre", text));
      }
      function box(label, value, cls) {
        var b = el("div", "box" + (cls ? " " + cls : ""));
        b.appendChild(el("b", null, value));
        b.appendChild(el("span", null, label));
        return b;
      }
      function renderSheet(c) {
        clear();
        app.appendChild(el("h1", null, c.name));
        var sub = [c.classOrArchetype, c.levelOrCr, c.background, c.alignment].filter(Boolean).join(" · ");
        if (sub) app.appendChild(el("div", "muted", sub));
        if (c.player) app.appendChild(el("div", "muted", c.player));

        var top = el("div", "grid g3");
        top.style.marginTop = "12px";
        var hp = String(c.hpCurrent) + " / " + String(c.hpMax) + (c.tempHp ? " (+" + c.tempHp + ")" : "");
        top.appendChild(box("AC", c.ac));
        top.appendChild(box(t("HP", "PF"), hp, "hp"));
        top.appendChild(box(t("Speed", "Velocità"), c.speed || "—"));
        top.appendChild(box("Init", c.initiative));
        top.appendChild(box(t("Prof.", "Comp."), c.proficiencyBonus));
        top.appendChild(box(t("Passive Perc.", "Perc. pass."), c.passivePerception));
        app.appendChild(top);
        if (c.acNote) app.appendChild(el("div", "muted", c.acNote));

        var wrap = el("div");
        (c.conditions || []).forEach(function (k) { wrap.appendChild(el("span", "chip", k)); });
        if (c.inspiration) wrap.appendChild(el("span", "chip", t("Inspiration", "Ispirazione")));
        if (wrap.firstChild) { app.appendChild(el("h2", null, t("Status", "Stato"))); app.appendChild(wrap); }

        app.appendChild(el("h2", null, t("Abilities", "Caratteristiche")));
        var ab = el("div", "grid g6");
        (c.abilities || []).forEach(function (a) {
          ab.appendChild(box(a.key.toUpperCase() + " " + a.score, a.mod));
        });
        app.appendChild(ab);

        section(t("Saving throws", "Tiri salvezza"), c.savingThrows);
        section(t("Skills", "Abilità"), c.skills);
        if ((c.actions || []).length) { app.appendChild(el("h2", null, t("Actions", "Azioni"))); addEntries(app, c.actions); }
        if ((c.traits || []).length) { app.appendChild(el("h2", null, t("Traits & features", "Tratti e capacità"))); addEntries(app, c.traits); }
        section(t("Spells", "Incantesimi"), c.spellsNotes);
        section(t("Equipment", "Equipaggiamento"), c.equipment);
        section(t("Languages", "Linguaggi"), c.languages);
        section(t("Senses", "Sensi"), c.senses);
        section(t("Other proficiencies", "Altre competenze"), c.otherProficiencies);
        var p = c.personality || {};
        section(t("Personality", "Personalità"), p.traits);
        section(t("Ideals", "Ideali"), p.ideals);
        section(t("Bonds", "Legami"), p.bonds);
        section(t("Flaws", "Difetti"), p.flaws);
        section(t("Biography", "Biografia"), c.biography);
      }

      /* ---------- connection ---------- */
      var delay = 1000;
      var current = null;
      function connect(playerToken) {
        if (current) { try { current.onclose = null; current.close(); } catch (_) {} }
        clear();
        app.appendChild(el("p", "muted", t("Connecting…", "Connessione…")));
        openSocket(playerToken);
      }
      function openSocket(playerToken) {
        var proto = location.protocol === "https:" ? "wss:" : "ws:";
        var ws = new WebSocket(proto + "//" + location.host + "/ws?p=" + encodeURIComponent(playerToken));
        current = ws;
        ws.onopen = function () { delay = 1000; setBanner(null); };
        ws.onmessage = function (e) {
          var m;
          try { m = JSON.parse(e.data); } catch (_) { return; }
          if (m.type === "sheet" && m.c) renderSheet(m.c);
          else if (m.type === "released") { store(null); ws.onclose = null; setBanner(null); showPicker(t("The DM released your character.", "Il master ha liberato il tuo personaggio.")); }
        };
        ws.onclose = function () {
          setBanner(t("Reconnecting…", "Riconnessione…"));
          setTimeout(function () { verifyThenOpen(playerToken); }, delay);
          delay = Math.min(delay * 2, 10000);
        };
      }
      // A restarted or released session invalidates the stored token: fall back to the picker.
      function verifyThenOpen(playerToken) {
        fetch("/api/me?p=" + encodeURIComponent(playerToken)).then(function (r) {
          if (r.status === 404) { store(null); setBanner(null); showPicker(t("The session was restarted: pick your character again.", "La sessione è stata riavviata: scegli di nuovo il personaggio.")); }
          else openSocket(playerToken);
        }).catch(function () { openSocket(playerToken); });
      }

      var saved = stored();
      if (saved) {
        fetch("/api/me?p=" + encodeURIComponent(saved)).then(function (r) {
          if (r.ok) connect(saved); else { store(null); showPicker(); }
        }).catch(function () { showPicker(); });
      } else {
        showPicker();
      }
    </script>
  </body>
</html>
