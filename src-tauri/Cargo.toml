[package]
name = "vellum"
version = "0.1.0"
description = "Vellum — D&D 5e Campaign & One-Shot Manager"
authors = ["DM"]
edition = "2021"

[lib]
name = "vellum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
