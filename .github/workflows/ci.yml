name: CI

# CI runs only for release work: PRs into `main` (the dev -> main release PR),
# release tags (including -rc.N pre-releases) and manual runs. Feature PRs into `dev` are not checked.
on:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v[0-9]*'
      - 'windows-v[0-9]*'
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build
      - run: cargo check
        working-directory: src-tauri
